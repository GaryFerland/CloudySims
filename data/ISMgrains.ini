abundances "solar_GASS10.abn"
# a typical ISM depletion pattern
metals deplete Jenkins 2009 Fstar=0.5 
# graphitic and silicate grains with ISM size distribution, 10 size bins each
grains ISM
# add our default PAHs with modern abundances
grains PAH 3
# turn off elements with low abundances 
# this is to avoid spending time working with heavily depeleted elements
# like Ti or Ca
element limit off -6 
