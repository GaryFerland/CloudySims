abundances "solar_GASS10.abn" 
# a typical ISM depletion pattern
metals deplete Jenkins 2009 Fstar=0.5 %OK, Chamani?
# graphite and silicate grains with ISM size distribution in ten size bins
grains ISM
# PAHs with today's typical abundances
grains PAH 3
# turn off very rare elements. This is to avoid doing the chemistry
# and ionization of heavily depleted elements
element limit off -6 
